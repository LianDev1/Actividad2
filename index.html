<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Utileria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Formulario + Modal</a> | 
        <a href="login.html">Iniciar Sesión</a>
    </nav>

    <div class="contenedor">
        <h2>Formulario de Registro</h2>
        <form id="formRegistro">
            <div class="campo">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre">
                <span class="error" id="err-nombre">Solo se permiten letras.</span>
            </div>

            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="text" id="correo">
                <span class="error" id="err-correo">Correo electrónico no válido.</span>
            </div>

            <div class="campo">
                <label>Teléfono (máx. 10 dígitos):</label>
                <input type="text" id="telefono">
                <span class="error" id="err-telefono">Máximo 10 dígitos.</span>
            </div>

            <div class="campo">
                <label>Fecha de Nacimiento:</label>
                <input type="date" id="fechaNac">
                <span class="error" id="err-fecha">Selecciona una fecha válida.</span>
            </div>

            <button type="submit">Enviar Datos</button>
        </form>
    </div>

    <!-- Ventana Modal para la Edad -->
    <div class="modal" id="modalEdad">
        <div class="modal-contenido">
            <h3>Resultado</h3>
            <p id="textoModal"></p>
            <button id="btnCerrar">Cerrar</button>
        </div>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();

            let nombre = document.getElementById('nombre').value;
            let correo = document.getElementById('correo').value;
            let telefono = document.getElementById('telefono').value;
            let fechaNac = document.getElementById('fechaNac').value;

            let valido = true;

            if (!soloLetras(nombre) || nombre === "") {
                document.getElementById('err-nombre').style.display = 'block';
                valido = false;
            } else {
                document.getElementById('err-nombre').style.display = 'none';
            }

            if (!validarCorreo(correo)) {
                document.getElementById('err-correo').style.display = 'block';
                valido = false;
            } else {
                document.getElementById('err-correo').style.display = 'none';
            }

            if (!validarLongitud(telefono, 10) || telefono === "") {
                document.getElementById('err-telefono').style.display = 'block';
                valido = false;
            } else {
                document.getElementById('err-telefono').style.display = 'none';
            }

            if (!fechaNac) {
                document.getElementById('err-fecha').style.display = 'block';
                valido = false;
            } else {
                document.getElementById('err-fecha').style.display = 'none';
            }

            if (valido) {
                let edad = calcularEdad(fechaNac);
                let esMayor = esMayorDeEdad(fechaNac);
                let nombreMayus = convertirMayusculas(nombre);

                document.getElementById('textoModal').innerHTML = 
                    "Hola <strong>" + nombreMayus + "</strong>.<br>Tienes <strong>" + edad + " años</strong> (" + (esMayor ? "Mayor de edad" : "Menor de edad") + ").";

                document.getElementById('modalEdad').style.display = 'flex';
            }
        });

        document.getElementById('btnCerrar').addEventListener('click', function() {
            document.getElementById('modalEdad').style.display = 'none';
        });
    </script>
</body>
</html>
