<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utileria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Formulario + Modal</a> | 
        <a href="login.html">Iniciar Sesión</a>
    </nav>

    <div class="contenedor">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="text" id="loginCorreo">
                <span class="error" id="err-loginCorreo">Correo no válido.</span>
            </div>

            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" id="loginPass">
                <span class="error" id="err-loginPass">Mín. 8 caracteres, 1 mayúscula, 1 número y 1 símbolo.</span>
            </div>

            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            let correo = document.getElementById('loginCorreo').value;
            let pass = document.getElementById('loginPass').value;

            let correoOk = validarCorreo(correo);
            let passOk = validarPassword(pass);

            document.getElementById('err-loginCorreo').style.display = correoOk ? 'none' : 'block';
            document.getElementById('err-loginPass').style.display = passOk ? 'none' : 'block';

            if (correoOk && passOk) {
                alert("✅ ¡Inicio de sesión exitoso!");
            }
        });
    </script>
</body>
</html>
